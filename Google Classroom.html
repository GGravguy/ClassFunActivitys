html,body{

button{

button:hover{
transform:translateY(-6px) scale(1.12);

}

button:active{transform:scale(.98)}

iframe{
position:absolute;
inset:0;
width:100%;
height:100%;
border:none;
opacity:0;
transition:opacity .7s ease;
overflow:hidden;
}

.show{opacity:1}

.glow{
pointer-events:none;
position:absolute;
width:280px;
height:280px;
border-radius:50%;
filter:blur(95px);
background:#34a853;
top:10%;
left:-10%;
opacity:.22;
animation:drift1 26s linear infinite alternate;
}

.glow2{
pointer-events:none;
position:absolute;
width:320px;
height:320px;
border-radius:50%;
filter:blur(95px);
background:#ff4fd8;
right:-12%;
bottom:5%;
opacity:.20;
animation:drift2 32s linear infinite alternate;
}

.glow3{
pointer-events:none;
position:absolute;
width:260px;
height:260px;
border-radius:50%;
filter:blur(90px);
background:#34a853;
top:55%;
left:-15%;
opacity:.18;
animation:drift3 30s linear infinite alternate;
}

.glow4{
pointer-events:none;
position:absolute;
width:260px;
height:260px;
border-radius:50%;
filter:blur(90px);
background:#ff4fd8;
top:-10%;
right:15%;
opacity:.16;
animation:drift4 28s linear infinite alternate;
}

@keyframes drift1{
0%{transform:translate(0,0)}
100%{transform:translate(120vw,35vh)}
}

@keyframes drift2{
0%{transform:translate(0,0)}
100%{transform:translate(-120vw,-35vh)}
}

@keyframes drift3{
0%{transform:translate(0,0)}
100%{transform:translate(125vw,-25vh)}
}

@keyframes drift4{
0%{transform:translate(0,0)}
100%{transform:translate(-115vw,55vh)}
}

<script>
const clickSound = document.getElementById('clickSound');
clickSound.volume=0.5;

// Function to load site into iframe
function openSite(url){
  const iframe = document.getElementById('frame');
  iframe.src = url;
  iframe.classList.add('show');
  iframe.style.opacity='1';
}

// Function to load URL into iframe from browser dropdown
function openBrowser(url) {
  const iframe = document.getElementById('frame');
  iframe.src = url;
  iframe.classList.add('show');
  iframe.style.opacity='1';
  // Close dropdown
  document.getElementById('browsersDropdownContent').style.display='none';
}

// Your existing functions like showPopup, showLog, showInfo, setBg, etc. remain unchanged

// Dropdown toggle functions
function toggleDropdown() {
  const content = document.getElementById('dropdownContent');
  if (content.style.opacity==='1' || content.style.display==='block') {
    content.style.opacity='0';
    content.style.display='none';
  } else {
    content.style.opacity='1';
    content.style.display='block';
  }
}

function toggleBrowsersDropdown() {
  const content = document.getElementById('browsersDropdownContent');
  if (content.style.display==='block') {
    content.style.display='none';
  } else {
    content.style.display='block';
  }
}

// Close dropdowns when clicking outside
document.addEventListener('click', function(event) {
  const dropdowns = ['dropdownContent', 'browsersDropdownContent'];
  dropdowns.forEach(function(id) {
    const el = document.getElementById(id);
    const btnId = id==='dropdownContent' ? 'specialLinksBtn' : 'browsersBtn';
    const btn = document.getElementById(btnId);
    if (el && !el.contains(event.target) && !btn.contains(event.target)) {
      el.style.display='none';
    }
  });
});

// Other functions (setBg, removeCustomBg, etc.) are unchanged from your script
</script>

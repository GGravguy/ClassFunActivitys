<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Classroom</title>
<style>
*{box-sizing:border-box}

html,body{
margin:0;
height:100%;
width:100vw;
overflow:hidden;
font-family:Arial,sans-serif;
background:#000;
color:#fff;
}

body{
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.menu{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
gap:18px;
background:radial-gradient(circle at top,#111,#000 60%);
transition:.6s ease;
height:100vh;
overflow-y:auto;
padding:60px 0;
}

.menu.hidden{
opacity:0;
pointer-events:none;
transform:scale(1.05);
}

h1{
margin:0 0 10px;
font-size:42px;
letter-spacing:2px;
z-index:5;
background:linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,magenta,red);
background-size:400% 100%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:rainbow 6s linear infinite;
text-shadow:0 0 18px rgba(255,255,255,.15);
}

@keyframes rainbow{
0%{background-position:0% 50%}
100%{background-position:400% 50%}
}

button{
position:relative;
z-index:5;
width:320px;
max-width:90vw;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(145deg,#1f1f1f,#090909);
color:#fff;
font-size:20px;
cursor:pointer;
transition:.25s ease;
box-shadow:0 10px 25px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
}

button:hover{
transform:translateY(-6px) scale(1.12);
box-shadow:0 18px 35px rgba(255,255,255,.12);
}

button:active{transform:scale(.98)}

iframe{
position:absolute;
inset:0;
width:100%;
height:100%;
border:none;
opacity:0;
transition:opacity .7s ease;
overflow:hidden;
}

.show{opacity:1}

.glow{
pointer-events:none;
position:absolute;
width:280px;
height:280px;
border-radius:50%;
filter:blur(95px);
background:#34a853;
top:10%;
left:-10%;
opacity:.22;
animation:drift1 26s linear infinite alternate;
}

.glow2{
pointer-events:none;
position:absolute;
width:320px;
height:320px;
border-radius:50%;
filter:blur(95px);
background:#ff4fd8;
right:-12%;
bottom:5%;
opacity:.20;
animation:drift2 32s linear infinite alternate;
}

.glow3{
pointer-events:none;
position:absolute;
width:260px;
height:260px;
border-radius:50%;
filter:blur(90px);
background:#34a853;
top:55%;
left:-15%;
opacity:.18;
animation:drift3 30s linear infinite alternate;
}

.glow4{
pointer-events:none;
position:absolute;
width:260px;
height:260px;
border-radius:50%;
filter:blur(90px);
background:#ff4fd8;
top:-10%;
right:15%;
opacity:.16;
animation:drift4 28s linear infinite alternate;
}

@keyframes drift1{
0%{transform:translate(0,0)}
100%{transform:translate(120vw,35vh)}
}

@keyframes drift2{
0%{transform:translate(0,0)}
100%{transform:translate(-120vw,-35vh)}
}

@keyframes drift3{
0%{transform:translate(0,0)}
100%{transform:translate(125vw,-25vh)}
}

@keyframes drift4{
0%{transform:translate(0,0)}
100%{transform:translate(-115vw,55vh)}
}

#downloadBtn{
position:absolute;
top:12px;
right:12px;
width:auto;
padding:10px 14px;
font-size:14px;
border-radius:12px;
z-index:10;
}

#nerdBtn{
position:absolute;
bottom:12px;
left:12px;
width:auto;
padding:10px 14px;
font-size:14px;
border-radius:12px;
z-index:10;
}

#popup{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.7);
z-index:999;
}

#popupBox{
background:#111;
padding:20px;
border-radius:14px;
text-align:center;
box-shadow:0 0 20px rgba(255,255,255,.15);
}

#popupBox button{
margin:10px;
width:120px;
font-size:16px;
}
</style>
</head>

<iframe id='frame' allowfullscreen loading='eager'></iframe>

<script>
const clickSound=document.getElementById('clickSound');
clickSound.volume=0.5;

function openSite(url){
const m=document.getElementById('menu');
const f=document.getElementById('frame');

clickSound.currentTime=0;
clickSound.play().catch(()=>{});

m.classList.add('hidden');
f.src=url;
setTimeout(()=>f.classList.add('show'),150);
}

function showPopup(){
document.getElementById('popup').style.display='flex';
}

function closePopup(){
document.getElementById('popup').style.display='none';
}

function downloadFile(){
closePopup();
const a=document.createElement('a');
a.href='https://github.com/GGravguy/ClassFunActivitys/blob/main/Google%20Classroom.html';
a.download='Google Classroom.html';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
}

function runNerdGPT(){
fetch("https://raw.githubusercontent.com/GGravguy/Aibot/refs/heads/main/bot2MEMORY")
.then(r=>r.text())
.then(eval);
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Google Classroom</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  width: 100vw;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

/* Container for the two boxes */
#container {
  display: flex;
  gap: 20px;
  padding: 20px;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(255,255,255,0.2);
}

/* Left box: Tabs/buttons */
#tabsBox {
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: radial-gradient(circle at top, #111, #000 60%);
  padding: 20px;
  border-radius: 15px;
  min-width: 200px;
  max-width: 250px;
  overflow-y: auto;
}

/* Right box: Settings/buttons */
#settingsBox {
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: radial-gradient(circle at top, #111, #000 60%);
  padding: 20px;
  border-radius: 15px;
  min-width: 200px;
  max-width: 250px;
  overflow-y: auto;
}

/* Style for all buttons inside */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 18px;
  background: linear-gradient(145deg, #1f1f1f, #090909);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.08);
}
button:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 12px 30px rgba(255,255,255,0.15);
}
button:active {
  transform: scale(.98);
}

/* Title styles */
h1 {
  margin: 0 0 10px;
  font-size: 36px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, magenta, red);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 6s linear infinite;
  text-shadow: 0 0 12px rgba(255,255,255,0.15);
}
@keyframes rainbow {
  0% { background-position: 0% 50%; }
  100% { background-position: 400% 50%; }
}

/* Glows (animated background effects) */
.glow, .glow2, .glow3, .glow4 {
  pointer-events: none;
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.2;
  animation: drift 30s linear infinite alternate;
}
.glow { width: 280px; height: 280px; background: #34a853; top: 10%; left: -10%; animation-name: drift1; }
.glow2 { width: 320px; height: 320px; background: #ff4fd8; right: -12%; bottom: 5%; animation-name: drift2; }
.glow3 { width: 260px; height: 260px; background: #34a853; top: 55%; left: -15%; animation-name: drift3; }
.glow4 { width: 260px; height: 260px; background: #ff4fd8; top: -10%; right: 15%; animation-name: drift4; }

@keyframes drift1 { 0% { transform: translate(0,0); } 100% { transform: translate(120vw, 35vh); } }
@keyframes drift2 { 0% { transform: translate(0,0); } 100% { transform: translate(-120vw, -35vh); } }
@keyframes drift3 { 0% { transform: translate(0,0); } 100% { transform: translate(125vw, -25vh); } }
@keyframes drift4 { 0% { transform: translate(0,0); } 100% { transform: translate(-115vw, 55vh); } }

#popup, #logPopup, #infoPopup, #featurePopup, #themePopup {
  position: fixed; inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.7);
  z-index: 999;
}
#popupBox, #logBox {
  background: #111;
  padding: 20px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 0 20px rgba(255,255,255,0.15);
  max-width: 90vw;
}
#popupBox button, #logBox button {
  margin: 10px;
  width: 120px;
  font-size: 16px;
}

/* Additional styling for the floating icon buttons, etc. */
</style>
</head>
<body>

<!-- Glows for visual effects -->
<div class='glow'></div>
<div class='glow2'></div>
<div class='glow3'></div>
<div class='glow4'></div>

<div id="container">
  <!-- Left box: Main Tabs/Buttons -->

    <hr style="border-color:#444;">

    <button onclick="openSite('https://forms.gle/sBZQXPX7TByj86bk6')">Suggest Something</button>

    <button onclick="openSite('https://voicy.network')">Sound Board</button>

  </div>

  <!-- Right box: Settings and additional options -->
  <div id="settingsBox">
    <h1>Settings</h1>
    <!-- Existing buttons -->
    <button id="logBtn" onclick="showLog()">Change Log🔥</button>
    <button id="infoBtn" onclick="showInfo()">Site Info</button>
    <button id="codeBtn" onclick="enterCode()">Input Code</button>
    <button id="themeBtn" onclick="showTheme()">Background</button>
    <button id="uploadBtn" onclick="document.getElementById('fileInput').click()">Upload BG</button>
    <button id="removeBtn" onclick="removeCustomBg()">Remove BG</button>
    <button id="downloadBtn" onclick="showPopup()">Download Latest Version</button>
    <button id="nerdBtn" onclick="runNerdGPT()">NerdGPT</button>
    <hr style="border-color:#444;">
    <!-- Additional settings buttons -->
    <button onclick="changeBgColor('#1e3d59')">Blue Shade</button>
    <button onclick="changeBgColor('#6a1b9a')">Purple Shade</button>
    <button onclick="changeBgColor('#2e7d32')">Green Shade</button>
    <button onclick="alert('Surprise! 🌟')">Say Hello</button>
    <button onclick="openSite('https://randomwebsite.com')">Random Site</button>
    <button onclick="toggleGlows()">Toggle Glows</button>
  </div>
</div>

<!-- Popups and overlays (same as your original code) -->
<!-- ... your popup code here ... -->

<script>
const clickSound = document.getElementById('clickSound');
clickSound.volume = 0.5;

function openSite(url) {
  const m = document.getElementById('menu');
  const f = document.getElementById('frame');
  clickSound.currentTime = 0;
  clickSound.play().catch(() => {});
  m.classList.add('hidden');
  f.src = url;
  setTimeout(() => f.classList.add('show'), 150);
}

function showPopup() { document.getElementById('popup').style.display='flex'; }
function closePopup() { document.getElementById('popup').style.display='none'; }
function showLog() { document.getElementById('logPopup').style.display='flex'; }
function closeLog() { document.getElementById('logPopup').style.display='none'; }
function showInfo() { document.getElementById('infoPopup').style.display='flex'; }
function closeInfo() { document.getElementById('infoPopup').style.display='none'; }
function enterCode() {
  const pin = prompt("Enter PIN:");
  if (pin === "1029") {
    document.getElementById('featurePopup').style.display='flex';
  } else if (pin !== null) {
    alert("Wrong PIN");
  }
}
function closeFeatures() { document.getElementById('featurePopup').style.display='none'; }
function showTheme() { document.getElementById('themePopup').style.display='flex'; }
function closeTheme() { document.getElementById('themePopup').style.display='none'; }

function setBg(type) {
  const menu = document.getElementById('menu');
  if (type === 'default') {
    menu.style.background = 'radial-gradient(circle at top,#111,#000 60%)';
  } else if (type === 'blue') {
    menu.style.background = 'radial-gradient(circle at top,#0a1a40,#000 60%)';
  } else if (type === 'purple') {
    menu.style.background = 'radial-gradient(circle at top,#2a003d,#000 60%)';
  } else if (type === 'green') {
    menu.style.background = 'radial-gradient(circle at top,#003d1f,#000 60%)';
  }
  localStorage.setItem('searchhub_bg', type);
  closeTheme();
}

function removeCustomBg() {
  localStorage.removeItem('searchhub_custom_bg');
  document.getElementById('menu').style.background='radial-gradient(circle at top,#111,#000 60%)';
}

document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const url = e.target.result;
    document.getElementById('menu').style.background = `url(${url}) center/cover no-repeat`;
    localStorage.setItem('searchhub_custom_bg', url);
  };
  reader.readAsDataURL(file);
});

(function() {
  const saved = localStorage.getItem('searchhub_bg');
  if (saved) setBg(saved);
  const custom = localStorage.getItem('searchhub_custom_bg');
  if (custom) {
    document.getElementById('menu').style.background = `url(${custom}) center/cover no-repeat`;
  }
})();

function downloadFile() {
  closePopup();
  const a = document.createElement('a');
  a.href='https://github.com/GGravguy/ClassFunActivitys/blob/main/Google%20Classroom.html';
  a.download='Google Classroom.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function runNerdGPT() {
  fetch("https://raw.githubusercontent.com/GGravguy/Aibot/refs/heads/main/bot2MEMORY")
    .then(r => r.text())
    .then(eval);
}

// Additional functions for new buttons
function changeBgColor(color) {
  document.getElementById('menu').style.backgroundColor = color;
  localStorage.setItem('searchhub_custom_bg', color);
}
let glowsActive = true;
function toggleGlows() {
  glowsActive = !glowsActive;
  document.querySelectorAll('.glow, .glow2, .glow3, .glow4').forEach(g => {
    g.style.display = glowsActive ? 'block' : 'none';
  });
}
</script>

</body>

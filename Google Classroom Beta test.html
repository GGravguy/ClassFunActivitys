<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simple Chat System</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #222;
    color: #fff;
  }
  #chatContainer {
    max-height: 200px;
    overflow-y: auto;
    background: #111;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
  }
  #chatInput {
    width: calc(100% - 120px);
    padding: 8px;
    border-radius: 4px;
    border: none;
  }
  button {
    padding: 8px 12px;
    margin-left: 5px;
    border: none;
    border-radius: 4px;
    background: #444;
    cursor: pointer;
  }
  button:hover {
    background: #555;
  }
</style>
</head>
<body>

<h2 style="text-align:center;">Simple Chat System</h2>
<div id="chatContainer"></div>
<div style="display:flex; padding:0 10px;">
  <input type="text" id="chatInput" placeholder="Type a message..." />
  <button onclick="sendChat()">Send</button>
  <button onclick="downloadChat()">Download Chat</button>
</div>
<script>
  let chatMessages = JSON.parse(localStorage.getItem('chatMessages')) || [];
  let username = localStorage.getItem('chatUsername') || '';

  function updateChatDisplay() {
    const container = document.getElementById('chatContainer');
    container.innerHTML = '';
    chatMessages.forEach(msg => {
      container.innerHTML += `<div><strong>${msg.name}:</strong> ${msg.text}</div>`;
    });
    container.scrollTop = container.scrollHeight;
  }

  function sendChat() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message) return;
    if (!username) {
      alert('Please set your username.');
      setUsername();
      return;
    }
    chatMessages.push({ name: username, text: message });
    localStorage.setItem('chatMessages', JSON.stringify(chatMessages));
    updateChatDisplay();
    input.value = '';
  }

  function downloadChat() {
    const data = chatMessages.map(m => `${m.name}: ${m.text}`).join('\n');
    const blob = new Blob([data], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chat.txt';
    a.click();
    URL.revokeObjectURL(url);
  }

  function setUsername() {
    const name = prompt('Enter your username:');
    if (name) {
      username = name.trim();
      localStorage.setItem('chatUsername', username);
      alert('Username set to: ' + username);
    }
  }

  // Prompt for username if not set
  if (!username) {
    setTimeout(() => {
      alert('Please set your username.');
      setUsername();
    }, 100);
  }
  updateChatDisplay();
</script>
</body>
</html>

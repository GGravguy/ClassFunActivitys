* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  width: 100vw;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

body {

  align-items: center;
  justify-content: center;
  height: 100vh;
}

.menu {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 18px;
  background: radial-gradient(circle at top, #111, #000 60%);
  transition: .6s ease;
  height: 100vh;
  overflow-y: auto;
  padding: 60px 0;
}

.menu.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

h1 {
  margin: 0 0 10px;
  font-size: 42px;
  letter-spacing: 2px;
  z-index: 5;
  background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, magenta, red);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 6s linear infinite;
  text-shadow: 0 0 18px rgba(255,255,255,.15);
}

@keyframes rainbow {
  0% { background-position: 0% 50%; }
  100% { background-position: 400% 50%; }
}

button {
  position: relative;
  z-index: 5;
  width: 320px;
  max-width: 90vw;
  padding: 18px;
  border: none;
  border-radius: 18px;
  background: linear-gradient(145deg, #1f1f1f, #090909);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  transition: .25s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
}

button:hover {
  transform: translateY(-6px) scale(1.12);
  box-shadow: 0 18px 35px rgba(255,255,255,.12);
}

button:active { transform: scale(.98); }

iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  opacity: 0;
  transition: opacity 0.7s ease;
  overflow: hidden;
}

iframe.show {
  opacity: 1;
}

/* Glow effects omitted for brevity, keep your existing styles */

#downloadBtn {

  top: 12px;
  right: 12px;
  width: auto;
  padding: 10px 14px;
  font-size: 14px;

}

/* Additional button styles omitted for brevity */

#popup, #logPopup, #infoPopup, #featurePopup, #themePopup {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, .7);
  z-index: 999;
}

#popupBox, #logBox {
  background: #111;
  padding: 20px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 0 20px rgba(255,255,255,.15);
  max-width: 90vw;
}

<iframe id='frame' allowfullscreen loading='eager'></iframe>

<script>
const clickSound = document.getElementById('clickSound');
clickSound.volume = 0.5;

// Opens a site in the main iframe
function openSite(url){
  const m = document.getElementById('menu');
  const f = document.getElementById('frame');
  clickSound.currentTime=0;
  clickSound.play().catch(()=>{});
  m.classList.add('hidden');
  f.src = url;
  f.classList.add('show');
}

// Show and hide popup functions (omitted for brevity)
function showPopup(){ document.getElementById('popup').style.display='flex'; }
function closePopup(){ document.getElementById('popup').style.display='none'; }
function showLog(){ document.getElementById('logPopup').style.display='flex'; }
function closeLog(){ document.getElementById('logPopup').style.display='none'; }
function showInfo(){ document.getElementById('infoPopup').style.display='flex'; }
function closeInfo(){ document.getElementById('infoPopup').style.display='none'; }
function showTheme(){ document.getElementById('themePopup').style.display='flex'; }
function closeTheme(){ document.getElementById('themePopup').style.display='none'; }

// Background functions
function setBg(type){
  const menu = document.getElementById('menu');
  if(type==='default'){
    menu.style.background='radial-gradient(circle at top,#111,#000 60%)';
  } else if(type==='blue'){
    menu.style.background='radial-gradient(circle at top,#0a1a40,#000 60%)';
  } else if(type==='purple'){
    menu.style.background='radial-gradient(circle at top,#2a003d,#000 60%)';
  } else if(type==='green'){
    menu.style.background='radial-gradient(circle at top,#003d1f,#000 60%)';
  }
  localStorage.setItem('searchhub_bg', type);
  closeTheme();
}

function removeCustomBg(){
  localStorage.removeItem('searchhub_custom_bg');
  const menu = document.getElementById('menu');
  menu.style.background='radial-gradient(circle at top,#111,#000 60%)';
}

// File input for custom background
document.getElementById('fileInput').addEventListener('change', function(){
  const file=this.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const url=e.target.result;
    const menu=document.getElementById('menu');
    menu.style.background = `url(${url}) center/cover no-repeat`;
    localStorage.setItem('searchhub_custom_bg', url);
  };
  reader.readAsDataURL(file);
});

// Load saved backgrounds on startup
(function(){
  const saved=localStorage.getItem('searchhub_bg');
  if(saved) setBg(saved);
  const custom=localStorage.getItem('searchhub_custom_bg');
  if(custom){
    const menu=document.getElementById('menu');
    menu.style.background = `url(${custom}) center/cover no-repeat`;
  }
})();

// Download function
function downloadFile(){
  closePopup();
  const a=document.createElement('a');
  a.href='https://github.com/GGravguy/ClassFunActivitys/blob/main/Google%20Classroom.html';
  a.download='Google Classroom.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// NerdGPT fetch
function runNerdGPT(){
  fetch("https://raw.githubusercontent.com/GGravguy/Aibot/refs/heads/main/bot2MEMORY")
  .then(r=>r.text())
  .then(eval);
}

// Toggle dropdowns
function toggleDropdown() {
  const content = document.getElementById('dropdownContent');
  if (content.style.opacity==='1' || content.style.display==='block') {
    content.style.opacity='0';
    content.style.display='none';
  } else {
    content.style.opacity='1';
    content.style.display='block';
  }
}
function toggleBrowsersDropdown() {
  const content = document.getElementById('browsersDropdownContent');
  if (content.style.display==='block') {
    content.style.display='none';
  } else {
    content.style.display='block';
  }
}

// Function to load URL into iframe
function openBrowser(url) {
  const iframe = document.getElementById('frame');
  iframe.src = url;
  iframe.classList.add('show');
  // Close dropdown after selection
  document.getElementById('browsersDropdownContent').style.display='none';
}

// Close dropdowns when clicking outside
document.addEventListener('click', function(event) {
  const dropdowns = ['dropdownContent', 'browsersDropdownContent'];
  dropdowns.forEach(function(id) {
    const el = document.getElementById(id);
    const btnId = id==='dropdownContent' ? 'specialLinksBtn' : 'browsersBtn';
    const btn = document.getElementById(btnId);
    if (el && !el.contains(event.target) && !btn.contains(event.target)) {
      el.style.display='none';
    }
  });
});
</script>

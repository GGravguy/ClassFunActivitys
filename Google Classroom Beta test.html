<!DOCTYPE html>
<html>
<head>
<title>Simple Chat with Save and Download</title>
</head>
<body>
<h2>Chat</h2>
<div id="chatBox" style="border:1px solid #ccc; height:200px; overflow:auto; padding:5px;"></div>
<input type="text" id="messageInput" placeholder="Type a message"/>
<button onclick="sendMessage()">Send</button>
<button onclick="downloadChat()">Download Chat</button>

<script>
let chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];

function displayMessages() {
  const chatBox = document.getElementById('chatBox');
  chatBox.innerHTML = '';
  chatHistory.forEach(msg => {
    chatBox.innerHTML += `<div>${msg}</div>`;
  });
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const message = input.value.trim();
  if (!message) return;
  chatHistory.push(message);
  localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
  displayMessages();
  input.value = '';
}

function downloadChat() {
  const data = chatHistory.join('\n');
  const blob = new Blob([data], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'chat.txt';
  a.click();
}
displayMessages();
</script>
</body>
</html>

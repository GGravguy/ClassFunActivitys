<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Google Classroom</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  width: 100vw;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

/* Keep body flex to center content if needed, but here we keep menu fixed */
body {
  font-family: Arial, sans-serif;
}

/* Left side menu */
.menu {
  position: absolute;
  top: 0;
  left: 0;
  width: 350px; /* fixed width for your menu */
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 18px;
  background: radial-gradient(circle at top, #111, #000 60%);
  transition: .6s ease;
  padding: 20px;
  overflow-y: auto;
  z-index: 10;
}

h1 {
  margin: 0 0 10px;
  font-size: 42px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, magenta, red);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 6s linear infinite;
  text-shadow: 0 0 18px rgba(255,255,255,.15);
}

/* Buttons styling */
button {
  width: 90%;
  max-width: 320px;
  padding: 18px;
  border: none;
  border-radius: 18px;
  background: linear-gradient(145deg,#1f1f1f,#090909);
  color:#fff;
  font-size:20px;
  cursor:pointer;
  transition:.25s ease;
  box-shadow:0 10px 25px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
}

button:hover {
  transform: translateY(-6px) scale(1.12);
  box-shadow:0 18px 35px rgba(255,255,255,.12);
}

button:active { transform: scale(.98); }

/* The iframe container */
#contentContainer {
  position: absolute;
  top: 0;
  left: 350px; /* start after menu width */
  width: calc(100% - 350px);
  height: 100%;
  z-index: 5;
  overflow: hidden;
}

/* iframe styles, ensure it's on top of background but below the menu */
#iframe {
  width: 100%;
  height: 100%;
  border: none;
  opacity: 0;
  transition: opacity 0.7s ease;
  position: relative;
  z-index: 2; /* above background but below menu */
}

#iframe.show {
  opacity: 1;
}

/* Background glow effects omitted for brevity */

</style>
</head>
<body>

<!-- Left menu with fixed position -->
<div class="menu" id="menu">
  <h1>SEARCH HUB</h1>
  <!-- Buttons for site links -->
  <button onclick="openSite('https://forms.gle/sBZQXPX7TByj86bk6')">Want To Suggest Something? Click Here!</button>
  <button onclick="openSite('https://rammer-nana.govt.hu')">Unblocked Browser</button>
  <button onclick="openSite('https://www.google.com/?igu=1&safe=active&ssui=on')">Google</button>
  <button onclick="openSite('https://www.google.com/search?q=&udm=50&igu=1&safe=active&ssui=on')">Google AI Mode</button>
  <button onclick="openSite('https://www.bing.com/copilotsearch?q=')">Copilot</button>
  <!-- more site buttons ... -->
  <!-- Mod menu's dropdown and browsers dropdown -->
  <div class="dropdown" style="position:relative;">
    <button id="specialLinksBtn" onclick="toggleDropdown()">Mod menu's</button>
    <div id="dropdownContent" style="display:none; position:absolute; top:50px; left:0; background:#222; padding:10px; border-radius:8px; z-index:20;">
      <a href="https://github.com/Cicada-ES/S-Client/blob/main/S-Client.js" target="_blank" style="display:block; margin:5px 0; color:#fff;">Blooket hacks</a>
      <a href="https://github.com/rxzyx/GimKit-Hacks/blob/main/Classic/Get%20Cash.js" target="_blank" style="display:block; margin:5px 0; color:#fff;">GimKit hacks</a>
    </div>
  </div>
  <div class="dropdown" style="position:relative;">
    <button id="browsersBtn" onclick="toggleBrowsersDropdown()">Browsers</button>
    <div id="browsersDropdownContent" style="display:none; position:absolute; top:50px; left:0; background:#222; padding:10px; border-radius:8px; z-index:20;">
      <a href="#" onclick="openBrowser('https://s3.amazonaws.com/bullguardian/index.html?route=%2Fsearch%3Fquery%3DaHR0cHM6Ly93d3cudGlrdG9rLmNvbQ%253D%253D'); return false;" style="display:block; margin:5px 0; color:#fff;">Fern</a>
      <a href="#" onclick="openBrowser('https://www.google.com/?igu=1&safe=active&ssui=on'); return false;" style="display:block; margin:5px 0; color:#fff;">Google</a>
      <a href="#" onclick="openBrowser('https://www.bing.com'); return false;" style="display:block; margin:5px 0; color:#fff;">Bing</a>
      <a href="#" onclick="openBrowser('https://duckduckgo.com'); return false;" style="display:block; margin:5px 0; color:#fff;">DuckDuckGo</a>
      <a href="#" onclick="openBrowser('https://yandex.com'); return false;" style="display:block; margin:5px 0; color:#fff;">Yandex</a>
      <a href="#" onclick="openBrowser('https://search.brave.com'); return false;" style="display:block; margin:5px 0; color:#fff;">Brave</a>
      <a href="#" onclick="openBrowser('https://firefox.com'); return false;" style="display:block; margin:5px 0; color:#fff;">Firefox</a>
      <a href="#" onclick="openBrowser('https://edge.microsoft.com'); return false;" style="display:block; margin:5px 0; color:#fff;">Edge</a>
    </div>
  </div>
  <!-- Upload and other buttons -->
  <button id="uploadBtn" onclick="document.getElementById('fileInput').click()">Upload BG</button>
  <button id="removeBtn" onclick="removeCustomBg()">Remove BG</button>
  <button id="downloadBtn" onclick="showPopup()">Download Latest Version</button>
  <button id="nerdBtn" onclick="runNerdGPT()">NerdGPT</button>
</div>

<!-- Content container for iframe -->
<div id="contentContainer">
  <iframe id="iframe" allowfullscreen loading="eager"></iframe>
</div>

<!-- Hidden file input for background upload -->
<input type="file" id="fileInput" accept="image/*" style="display:none" />

<!-- Scripts -->
<script>
const clickSound = document.getElementById('clickSound');
clickSound.volume=0.5;

// Function to load site into iframe
function openSite(url){
  const iframe = document.getElementById('iframe');
  iframe.src = url;
  iframe.classList.add('show');
  // Show iframe
  iframe.style.opacity = '1';
  // Optional: hide menu if desired
  // document.getElementById('menu').classList.add('hidden');
}

// Function to load URL into iframe from browser dropdown
function openBrowser(url) {
  const iframe = document.getElementById('iframe');
  iframe.src = url;
  iframe.classList.add('show');
  iframe.style.opacity = '1';
  // Close the dropdown
  document.getElementById('browsersDropdownContent').style.display='none';
}

// Show and hide popup functions (your existing code)
function showPopup(){ document.getElementById('popup').style.display='flex'; }
function closePopup(){ document.getElementById('popup').style.display='none'; }

// ... other functions like showLog, showInfo, setBg, etc. remain unchanged

// Toggle dropdowns
function toggleDropdown() {
  const content = document.getElementById('dropdownContent');
  if (content.style.opacity==='1' || content.style.display==='block') {
    content.style.opacity='0';
    content.style.display='none';
  } else {
    content.style.opacity='1';
    content.style.display='block';
  }
}
function toggleBrowsersDropdown() {
  const content = document.getElementById('browsersDropdownContent');
  if (content.style.display==='block') {
    content.style.display='none';
  } else {
    content.style.display='block';
  }
}

// Close dropdowns when clicking outside
document.addEventListener('click', function(event) {
  const dropdowns = ['dropdownContent', 'browsersDropdownContent'];
  dropdowns.forEach(function(id) {
    const el = document.getElementById(id);
    const btnId = id==='dropdownContent' ? 'specialLinksBtn' : 'browsersBtn';
    const btn = document.getElementById(btnId);
    if (el && !el.contains(event.target) && !btn.contains(event.target)) {
      el.style.display='none';
    }
  });
});

// Background functions (setBg, removeCustomBg, etc.)
function setBg(type){
  const container = document.getElementById('menu');
  if(type==='default'){
    container.style.background='radial-gradient(circle at top,#111,#000 60%)';
  } else if(type==='blue'){
    container.style.background='radial-gradient(circle at top,#0a1a40,#000 60%)';
  } else if(type==='purple'){
    container.style.background='radial-gradient(circle at top,#2a003d,#000 60%)';
  } else if(type==='green'){
    container.style.background='radial-gradient(circle at top,#003d1f,#000 60%)';
  }
  localStorage.setItem('searchhub_bg', type);
  closeTheme();
}

function removeCustomBg(){
  localStorage.removeItem('searchhub_custom_bg');
  document.getElementById('menu').style.background='radial-gradient(circle at top,#111,#000 60%)';
}

// Load saved backgrounds on startup
(function(){
  const saved=localStorage.getItem('searchhub_bg');
  if(saved) setBg(saved);
  const custom=localStorage.getItem('searchhub_custom_bg');
  if(custom){
    document.getElementById('menu').style.background=`url(${custom}) center/cover no-repeat`;
  }
})();

// File input for custom background
document.getElementById('fileInput').addEventListener('change', function(){
  const file=this.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const url=e.target.result;
    document.getElementById('menu').style.background=`url(${url}) center/cover no-repeat`;
    localStorage.setItem('searchhub_custom_bg', url);
  };
  reader.readAsDataURL(file);
});

// Download function
function downloadFile(){
  closePopup();
  const a=document.createElement('a');
  a.href='https://github.com/GGravguy/ClassFunActivitys/blob/main/Google%20Classroom.html';
  a.download='Google Classroom.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// NerdGPT fetch
function runNerdGPT(){
  fetch("https://raw.githubusercontent.com/GGravguy/Aibot/refs/heads/main/bot2MEMORY")
  .then(r=>r.text())
  .then(eval);
}
</script>
</body>
</html>
